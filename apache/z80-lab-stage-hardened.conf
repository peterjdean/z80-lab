# Z80/LAB PRIVATE Apache stage; existing port 127.0.0.1:8082 Listen stays enabled.
# Requires: a2enmod headers; do NOT expose port 8082 to the LAN or internet.
<VirtualHost 127.0.0.1:8082>
    ServerName z80-lab-stage.localhost
    DocumentRoot /var/www/z80-lab/current
    ErrorLog ${APACHE_LOG_DIR}/z80-lab-stage-error.log
    CustomLog ${APACHE_LOG_DIR}/z80-lab-stage-access.log combined

    <Directory /var/www/z80-lab>
        # Controlled current symlink allows instant release promotion/rollback.
        Options FollowSymLinks
        AllowOverride None
        Require local
        AddType application/wasm .wasm
        AddType text/javascript .mjs
    </Directory>

    # ZIP assets have deterministic 2020 timestamps: disable stale caching.
    FileETag None
    Header always set Cache-Control "no-store, max-age=0"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Frame-Options "DENY"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

    # Enforced policy deliberately targets Safari 16+; see PUBLIC_DEPLOYMENT.md.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; worker-src 'self'; connect-src 'self'; img-src 'self' data: blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"
</VirtualHost>
